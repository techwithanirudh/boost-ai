[project]
name = "pyhub"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pylgbst[bleak] @ git+https://github.com/undera/pylgbst.git",
    "bleak==0.22.3",
    "fastapi[standard]>=0.100.0",
    "uvicorn[standard]",
    "sqlmodel",
