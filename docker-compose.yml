services:
  server:
    container_name: server
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      DATABASE_URL: ${DATABASE_URL}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      HUB_BASE_URL: ${HUB_BASE_URL:-http://hub:8000}
      MEDIAMTX_BASE_URL: ${MEDIAMTX_BASE_URL:-http://mediamtx:8888}
      MEDIAMTX_STREAM_PATH: ${MEDIAMTX_STREAM_PATH:-cam}
    ports:
      - "3000:3000"
    depends_on:
      hub:
        condition: service_healthy
      mediamtx:
        condition: service_started
    restart: unless-stopped

  hub:
    container_name: hub
    build:
      context: .
      dockerfile: apps/hub/Dockerfile
    environment:
      PORT: ${HUB_PORT:-8000}
      HUB_MAC: ${HUB_MAC:-}
      HUB_CONNECT_TIMEOUT_S: ${HUB_CONNECT_TIMEOUT_S:-300}
      WATCHDOG_TIMEOUT_S: ${WATCHDOG_TIMEOUT_S:-5}
      MOTOR_DEFAULT_SPEED: ${MOTOR_DEFAULT_SPEED:-0.5}
      COMMAND_TIMEOUT_S: ${COMMAND_TIMEOUT_S:-10}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').getcode()==200 else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mediamtx:
    container_name: mediamtx
    image: bluenviron/mediamtx:latest
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554"  # RTSP (iPhone Larix publishes here)
      - "8888:8888"  # HLS / snapshot API
      - "9997:9997"  # MediaMTX API
    restart: unless-stopped
