[tool.poetry]
name = "hub"
version = "0.1.0"
description = "LEGO Boost BLE control plane."
authors = ["Anirudh Sriram <techwithanirudh@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.116.1"
uvicorn = { version = "0.35.0", extras = ["standard"] }
pydantic = "2.11.7"
ev3-dc = "^0.9"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
poethepoet = "^0.29.0"
pytest = "^8.3.5"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"
ruff = "^0.8.0"

[tool.poe.tasks]
build = { shell = "echo 'hub: nothing to build'" }
dev   = "uvicorn main:app --reload --host 0.0.0.0 --port 8000 --loop asyncio"
start = "uvicorn main:app --host 0.0.0.0 --port 8000 --loop asyncio"
test  = "pytest tests/ -v"
lint  = "ruff check . && ruff format --check ."
fmt   = "ruff format ."

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
