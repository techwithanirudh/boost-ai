# MediaMTX configuration for Boost robot camera
# iPhone Larix pushes RTMP to rtmp://<host>:1935/live/stream
# ffmpeg captures a JPEG snapshot to /tmp/snapshot.jpg every 2 s (for AI + operator UI)

logLevel: info

api: true
apiAddress: :9997

rtsp: true
rtspAddress: :8554

hls: false

# RTMP - Larix pushes to rtmp://<host>:1935/live/stream
rtmp: true
rtmpAddress: :1935
srt: false

webrtc: false

pathDefaults:
  # Spawn ffmpeg when a publisher connects; write a JPEG every 2 s for the AI
  runOnReady: >-
    ffmpeg -hide_banner -loglevel quiet
    -rtsp_transport tcp -i rtsp://127.0.0.1:8554/$MTX_PATH
    -vf transpose=clock,fps=2 -update 1 -y /tmp/snapshot.jpg
  runOnReadyRestart: yes

paths:
  live/stream:
    source: publisher
